version: '2.29.2'

services:
  db:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    networks:
      - mynetwork

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    image: backend
    container_name: backend
    depends_on:
      - db
    volumes:
      - ./backend/source:/server
    networks:
      - mynetwork
    restart: always
    env_file:
      - .env

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/.next
      - ./.env:/app/.env
    networks:
      - mynetwork
    restart: always

  nginx:
    image: nginx
    container_name: nginx
    build: ./nginx
    ports:
      - "8443:443"
    volumes:
      - ./backend/source/media:/media
    networks:
      - mynetwork
    depends_on:
      - backend
      - frontend
    restart: always

networks:
  mynetwork:
    driver: bridge
